name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_ENV: test
  APP_URL: http://127.0.0.1:3000
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.11.1
      - run: npm ci
      # TEMPORARY (Task 03): apply formatting in the runner and print the diff, so the
      # rest of the gates run in the same pass. Removed before the task is committed.
      - name: Formatting diff
        run: npm run format && git --no-pager diff
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run check:boundaries
      - run: npm run check:secrets
      - run: npm run check:licenses
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format cyclonedx > sbom.json
      - name: Build with Vercel production foundation configuration
        run: npm run build
        env:
          APP_ENV: ''
          APP_URL: ''
          APPLICATION_MODE: foundation
          VERCEL_ENV: production
          # The hosting project may still carry another application's database identity.
          SUPABASE_URL: https://leftoverproject.supabase.co
          SUPABASE_ANON_KEY: synthetic-public-build-key
          SUPABASE_SERVICE_ROLE_KEY: synthetic-service-build-key
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-evidence
          path: |
            playwright-report/
            test-results/
            sbom.json
          retention-days: 30
  secret-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Scan tracked source and complete history
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 git /repo --redact --verbose
