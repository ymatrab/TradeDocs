name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_ENV: test
  APP_URL: http://127.0.0.1:3000
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.11.1
      - run: npm ci
      # TEMPORARY (Task 04): format in the runner and publish the exact patch, so formatting,
      # lint, typecheck and the build are all reported by a single pass. Removed before commit.
      - name: Formatting patch
        run: npm run format && git --no-pager diff > format.patch
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run check:boundaries
      - run: npm run check:secrets
      - run: npm run check:licenses
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format cyclonedx > sbom.json
      - name: Build with Vercel production foundation configuration
        run: npm run build
        env:
          APP_ENV: ''
          APP_URL: ''
          APPLICATION_MODE: foundation
          VERCEL_ENV: production
          # The hosting project may still carry another application's database identity.
          SUPABASE_URL: https://leftoverproject.supabase.co
          SUPABASE_ANON_KEY: synthetic-public-build-key
          SUPABASE_SERVICE_ROLE_KEY: synthetic-service-build-key
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-evidence
          path: |
            playwright-report/
            test-results/
            sbom.json
            format.patch
          retention-days: 30
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A disposable Supabase stack in the runner. The no-local-runs instruction forbids
      # starting a database on the developer machine, and no production or shared project
      # is reachable from here, so every migration and policy is proved against this.
      - name: Start a disposable Supabase stack
        run: npx supabase start
      # Generated before the proof so a failing assertion still publishes usable types.
      - name: Generate database types
        run: npx supabase gen types typescript --local > database.types.generated.ts
      - name: Prove tenant isolation and role authority with pgTAP
        run: npx supabase test db
      - name: Fail if the committed types are stale
        run: |
          if [ -f src/lib/database.types.ts ]; then
            diff -u src/lib/database.types.ts database.types.generated.ts \
              || { echo "::error::Generated types are stale. Commit the regenerated file."; exit 1; }
          else
            echo "::warning::No committed types yet. Take them from the database-evidence artifact."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: database-evidence
          path: database.types.generated.ts
          retention-days: 30
      - if: always()
        run: npx supabase stop --no-backup

  secret-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Scan tracked source and complete history
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 git /repo --redact --verbose
